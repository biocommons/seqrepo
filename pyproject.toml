[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 80.0", "setuptools_scm[toml] >= 9.0"]


[dependency-groups]
dev = [
  # code quality & formatting
  "deptry>=0.25.1",
  "mypy>=2.4.0",
  "nox>=2026.8.17",
  "prek>=0.5.5",
  "ruff>=0.17.0",
  "toml-sort>=0.25.0",
  "uv-bump>=0.6.0",

  # testing
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-recording>=0.14.0",
  "vcrpy>=8.3.0",

  # documentation
  "mkdocs>=1.6.1",
  "mkdocs-awesome-nav>=3.3.0",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.7",

  # misc dev tools
  "ipython>=9.17.1",
  "jupyter>=1.1.1",
]
docs = ["mkdocs"]

[project]
authors = [
  {email = "biocommons-dev@googlegroups.com", name = "biocommons contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
# mandatory runtime dependencies only
dependencies = [
    "bioutils >= 0.6",
    "pysam >= 0.23",
    "requests >= 2.32",
    "tqdm >= 4.67",
    "typing_extensions",
    "yoyo-migrations >= 9.0",
]
description = "Non-redundant, compressed, journalled, file-based storage for biological sequences"
dynamic = ["version"]
keywords = [
  "biocommons",
  "bioinformatics",
  "computational biology",
  "genome variation",
  "genomics",
  "hgvs",
  "variation"
]
license = "Apache-2.0"
name = "biocommons.seqrepo"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
shell = ["ipython >= 8.33"]

[project.scripts]
seqrepo = "biocommons.seqrepo.cli:main"

[project.urls]
Changelog = "https://github.com/biocommons/seqrepo/releases"
Documentation = "https://biocommons.github.io/seqrepo/"
Homepage = "https://github.com/biocommons/seqrepo/"
Issues = "https://github.com/biocommons/seqrepo/issues/"
Repository = "https://github.com/biocommons/seqrepo/"

[tool.coverage]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[tool.coverage.run]
branch = true
omit = [
  "*_test.py",
  "*/test/*",
  "*/tests/*",
  "src/biocommons/seqrepo/cli.py",  # CLI not covered by tests
]
source = ["src"]

[tool.deptry]

[tool.deptry.per_rule_ignores]
# prettytable: lazily imported only by private _dump_aliases() debugging helpers; not a runtime dependency
DEP001 = ["prettytable"]

[tool.deptry.package_module_name_map]
# map package name to import name
# Making this explicit suppresses deptry notices
coloredlogs = "coloredlogs"
mkdocs = "mkdocs"
mkdocs-material = "mkdocs_material"
mkdocstrings = "mkdocstrings"
mypy = "mypy"
pytest = "pytest"
pytest-cov = "pytest_cov"
pyyaml = "yaml"
ruff = "ruff"
ty = "ty"

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob='*.rst' --doctest-glob='*.txt' -m 'not extra'"
doctest_optionflags = [
  "ALLOW_BYTES",
  "ALLOW_UNICODE",
  "ELLIPSIS",
  "IGNORE_EXCEPTION_DETAIL",
  "NORMALIZE_WHITESPACE"
]
filterwarnings = [
  "default",
  # yoyo/backends/base.py: default datetime adapter deprecated in Python 3.12; no yoyo fix (2025-03-02)
  "ignore:The default datetime adapter is deprecated",
  # Python 3.13+ ResourceWarnings for unclosed sqlite3 connections from third-party libraries
  # (importlib_metadata, collections, ast), not seqrepo; https://github.com/python/cpython/issues/105539
  "ignore:unclosed database in <sqlite3.Connection object:ResourceWarning",
]
markers = [
  "extra: optional tests; deselect with -m 'not extra'",
  "network: tests that require network connectivity",
  "slow: slow tests that should be run infrequently",
  "vcr: tests that use recorded HTTP cassettes",
]
norecursedirs = [
  "*.egg-info", ".eggs", "_data", "build", "cover", "dist", "etc", "examples", "misc", "prof",
  "sbin", "tmp", "venv",
]
strict_markers = true
testpaths = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
preview = true
quote-style = "double"

[tool.ruff.lint]
fixable = [
  "B",
  "C4",
  "D",
  "EM",
  "F401",
  "F541",
  "I",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "UP"
]
ignore = [
  "E111",
  "E114",
  "E117",
  "E501",
  "E731",
  "N801",
  "N802",
  "PLR0913",
  "RET504",
  "S321",
  "W191",
]
select = [
  "A", # https://docs.astral.sh/ruff/rules/#flake8-builtins-a
  "ARG", # https://docs.astral.sh/ruff/rules/#flake8-unused-arguments-arg
  "B", # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "C4", # https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "DTZ", # https://docs.astral.sh/ruff/rules/#flake8-datetimez-dtz
  "E",
  "EM", # https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
  "F", # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "G", # https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
  "I", # https://docs.astral.sh/ruff/rules/#isort-i
  "LOG", # https://docs.astral.sh/ruff/rules/#flake8-logging-log
  "N", # https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "PERF", # https://docs.astral.sh/ruff/rules/#perflint-perf
  "PIE", # https://docs.astral.sh/ruff/rules/#flake8-pie-pie
  "PL", # https://docs.astral.sh/ruff/rules/#pylint-pl
  "PT", # https://docs.astral.sh/ruff/rules/#flake8-pytest-style-pt
  "PTH", # https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "RET", # https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "RSE", # https://docs.astral.sh/ruff/rules/#flake8-raise-rse
  "RUF", # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
  "S", # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "SIM", # https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "TRY", # https://docs.astral.sh/ruff/rules/#tryceratops-try
  "UP", # https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "W", # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "YTT" # https://docs.astral.sh/ruff/rules/#flake8-2020-ytt
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
  "PLR2004", # Magic value used in comparison
  "S101", # Use of `assert` detected
]

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}
zip-safe = true

[tool.setuptools.package-data]
# "*" = ["_data/*/*.json.gz"]
# "*" = ["*.gz", "*.json", "*.yaml"]
"*" = ["_data/*"]
"biocommons.seqrepo.fastadir" = ["_data/migrations/*"]
"biocommons.seqrepo.seqaliasdb" = ["_data/migrations/*"]

[tool.setuptools.packages.find]
exclude = ["*.pyc", "__pycache__"]
where = ["src"]

[tool.setuptools_scm]
